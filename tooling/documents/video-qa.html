<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>مراجعة فيديو نبري</title>
  <style>
    html,body{margin:0;background:#071b14;display:grid;place-items:center;width:100%;height:100%;overflow:hidden}
    video{width:100vw;height:100vh;object-fit:contain;background:#071b14}
  </style>
</head>
<body>
  <video id="v" muted playsinline preload="auto"></video>
  <script>
    const q=new URLSearchParams(location.search);const v=document.getElementById('v');
    v.src='video-files/'+q.get('name');
    v.addEventListener('loadedmetadata',()=>{v.currentTime=Number(q.get('t')||0)});
    v.addEventListener('seeked',()=>{window.qaReady=true});
  </script>
</body>
</html>
